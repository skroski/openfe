services:
  postgres:
    image: postgres:16-alpine
    container_name: opennfe-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opennfe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opennfe_secret}
      POSTGRES_DB: ${POSTGRES_DB:-opennfe_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opennfe -d opennfe_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: opennfe-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

